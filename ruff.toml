# Lint config. Rule set is pyflakes (F) + a subset of pycodestyle (E4/E7/E9),
# which catches real problems (unused imports/names, undefined names) without
# fighting the codebase's existing style.
target-version = "py312"

[lint]
# Pinned explicitly rather than relying on ruff's implicit "no select ="
# default: that default has changed between ruff releases, and an unpinned
# `pip install ruff` in CI silently picked up a much wider rule set
# (pyupgrade, refurb, flake8-bugbear, ...) than a locally-pinned older ruff
# ever surfaced - CI failed on hundreds of pre-existing findings this file
# was never meant to flag. Pinning here keeps local and CI runs identical
# regardless of which ruff version either happens to have installed.
select = ["E4", "E7", "E9", "F"]
# E741: "ambiguous variable name" (single-letter l/I/O). Stylistic only, and
# present intentionally in a few tight numeric loops, so keep it off.
ignore = ["E741"]
