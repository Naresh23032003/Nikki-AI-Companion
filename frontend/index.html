<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- N11: user-scalable=no/maximum-scale=1.0 was blocking pinch-zoom, a
         well-documented WCAG 1.4.4/1.4.10 accessibility failure that
         actively harms low-vision users - "app-like" is not a reason to
         override it; neither iOS nor Android guidance recommends this
         anymore. viewport-fit=cover (notch/safe-area support) kept. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111b21" />
    <meta name="description" content="Your personal AI companion" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Companion" />
    <title>Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
